name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator and capture crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            APK=$(find TMessagesProj_App/build/outputs/apk/afat/debug -name "*.apk" | head -n1)
            echo "Installing $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -n org.telegram.messenger.tjgram/org.telegram.ui.LaunchActivity
            sleep 20
            adb logcat -d > /tmp/logcat_full.txt
            echo "=== Full logcat saved, printing crash-relevant lines ==="
            grep -iE "FATAL EXCEPTION|AndroidRuntime|tjgram|org\.telegram|Caused by|signal [0-9]+|backtrace" /tmp/logcat_full.txt | tail -300 || echo "No matching lines found"
            cp /tmp/logcat_full.txt logcat_full.txt

      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat_full.txt
          if-no-files-found: ignore
